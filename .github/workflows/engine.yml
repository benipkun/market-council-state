# Market Council calculation engine: correlations, volatility, the portfolio health check, the
# optimiser comparison, research cards, the testing lab and the decision desk. Plain Python on
# GitHub's servers, so the arithmetic is done by code and can be re-run by anyone. It reads the
# repository's records and public price history, writes its results to state/ and research/, and
# never places orders. It runs after each bookkeeping run, when the ledger, the risk profile or the
# engine itself changes, and when the app records an answer in answers/ (then only the decision
# desk runs, which takes seconds).
name: Calculation engine
on:
  push:
    branches: [main]
    paths: ["ops/engine/**", "brief/index.html", "treasury/ledger.json", "state/profiles.json", "answers/**"]
  schedule:
    - cron: "40 6,13,21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calculation-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Always start from the newest main, so a run that waited in the queue builds on the results of the run before it.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy and scipy
        run: pip install --quiet numpy scipy
      - name: Restore the last good price files
        uses: actions/cache@v4
        with:
          path: .cache/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Run the engine
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NTFY_OUT: ${{ secrets.NTFY_OUT }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          FILES="ops/engine/engine.py ops/engine/research.py ops/engine/decide.py"
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^answers/' && [ -f state/quant.json ] && [ -f state/lab.json ]; then
              echo "Only answers changed: running the decision desk alone."
              FILES="ops/engine/decide.py"
              export MC_QUICK=1
            fi
          fi
          for f in $FILES; do
            if [ -f "$f" ]; then echo "== $f"; python "$f" || echo "$f failed" >> /tmp/engine_failed; fi
          done
      - name: Commit the results
        run: |
          git config user.name "Market Council Engine"
          git config user.email "engine@market-council.local"
          git add -A state research
          if git diff --cached --quiet; then echo "Nothing changed."; else
            git commit -q -m "Engine: results $(date -u +%Y-%m-%dT%H:%MZ)"
            # If main moved meanwhile, replay this commit on top of it; where both changed a results file, the fresh results win.
            pushed=0
            for i in 1 2 3 4; do
              if git fetch -q origin main && git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "The results could not be saved to the repository."; exit 1; fi
          fi
          if [ -s /tmp/engine_failed ]; then cat /tmp/engine_failed; exit 1; fi
